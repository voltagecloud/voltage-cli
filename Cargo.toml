[package]
name = "voltage-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "The command-line interface for the Voltage API"
repository = "https://github.com/voltagecloud/voltage-cli"

[[bin]]
name = "voltage"
path = "src/main.rs"

# Every dependency is pinned to the exact version in Cargo.lock; bump both deliberately.
[dependencies]
clap = { version = "=4.6.7", features = ["derive", "string"] }
clap_complete = "=4.6.11"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
toml = "=1.1.6"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time", "signal"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form", "query", "stream"] }
# The TLS provider is ring, installed at startup; aws-lc-rs would need a C toolchain on every platform.
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
uuid = { version = "=1.26.1", features = ["v4", "serde"] }
sha2 = "=0.11.0"
hex = "=0.4.3"
rpassword = "=7.5.4"
webbrowser = "=1.2.4"
futures-util = "=0.3.34"
url = "=2.5.8"
zeroize = { version = "=1.9.0", features = ["serde"] }
bytes = "=1.12.1"
fastrand = "=2.5.0"
httpdate = "=1.0.3"
qrcode = { version = "=0.14.1", default-features = false }
arboard = { version = "=3.6.1", default-features = false }

# `v1` selects the native stores: Keychain, Windows Credential Manager, and the
# pure-Rust Secret Service client, so Linux builds need no D-Bus development library.
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[build-dependencies]
serde_json = "=1.0.151"

[dev-dependencies]
tempfile = "=3.27.0"
assert_cmd = "=2.2.2"
wiremock = "=0.6.5"

[profile.release]
lto = "thin"
strip = true
