[package]
name = "voltage-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The command-line interface for the Voltage API"
repository = "https://github.com/voltagecloud/voltage-cli"

[[bin]]
name = "voltage"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["string"] }
clap_complete = "4.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"
sha2 = "0.10"
hex = "0.4"
rpassword = "7"
webbrowser = "1"
futures-util = "0.3"
url = "2"
zeroize = "1"
httpdate = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
