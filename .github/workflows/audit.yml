name: Security audit

on:
  schedule:
    # Daily, so a newly published advisory is reported without a code change.
    - cron: "0 6 * * *"
  push:
    branches:
      - master
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit locked dependencies against RustSec
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Scheduled runs open an issue for each new advisory; pull requests get a check.
      issues: write
      checks: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
