name: Security audit

on:
  schedule:
    # Daily, so a newly published advisory is reported without a code change.
    - cron: "0 6 * * *"
  push:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit locked dependencies against RustSec
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Scheduled runs open an issue for each new advisory; pull requests get a check.
      issues: write
      checks: write

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
