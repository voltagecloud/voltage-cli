name: Prepare release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vX.Y.Z) that passed staging integration
        required: true
      staging_verified:
        description: Approval, issuance, refresh, revocation, and test-wallet integration passed
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  build:
    if: inputs.staging_verified
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Verify tag/version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ["RELEASE_TAG"]
          assert re.fullmatch(r"v\d+\.\d+\.\d+", tag)
          version = re.search(r'^version = "([^"]+)"', open('Cargo.toml').read(), re.M)[1]
          assert tag[1:] == version
          PY
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked
      - run: python3 scripts/check-coverage.py
      - run: bash scripts/package.sh '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Checksums and Homebrew formula
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/release-manifest.py "${RELEASE_TAG#v}" dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes dist/*
