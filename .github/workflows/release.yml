name: Release

# Pushing a stable version tag (vX.Y.Z) that sits on master builds the release
# archives and opens a draft GitHub release. Publishing the draft stays manual
# and follows the staging acceptance in docs/development.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# A release is never cancelled halfway through its dependency chain.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify the release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out the tagged commit with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a stable semantic version on the default branch
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Use a stable version tag such as v0.1.0.'
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          manifest=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [[ "$version" != "$manifest" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match Cargo.toml version $manifest."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $RELEASE_TAG is not on $DEFAULT_BRANCH."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Verify, build, and package (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        if: runner.os != 'Windows'
        run: cargo test --locked

      # Integration tests assert Unix file ownership and permissions.
      - name: Run unit tests
        if: runner.os == 'Windows'
        run: cargo test --locked --lib

      - name: Verify the API contract mapping and command reference
        shell: bash
        run: |
          "$(command -v python3 || command -v python)" scripts/check-coverage.py

      - name: Package and smoke test the extracted archive
        run: bash scripts/package.sh '${{ matrix.target }}'

      # SLSA provenance binds each archive to this repository, workflow, and tag,
      # so users can verify a download was built here and not tampered with.
      - name: Attest the package's build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create the draft GitHub release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download every package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Write checksums and the Homebrew formula
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python3 scripts/release-manifest.py "$RELEASE_VERSION" dist
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing: the certificate names this workflow and tag, and the
      # signature lands in the Rekor transparency log. No keys to manage.
      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Create the draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes dist/*
