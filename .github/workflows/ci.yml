name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format, lint, and contract checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install the toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@38e8f5e4c386b611d51e8aa997b9a06a3c8eb67a # v1.15.6

      - name: Install cargo-machete
        # --force: the Cargo cache can restore the install marker without the
        # binary, and binstall would otherwise skip the install.
        run: cargo binstall cargo-machete@0.9.2 --no-confirm --force

      - name: Check for unused dependencies
        run: cargo machete --with-metadata

      - name: Verify the API contract mapping and command reference
        run: python3 scripts/check-coverage.py

  test:
    name: Tests and package smoke (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install the toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1

      - name: Compile tests
        run: cargo test --locked --no-run

      - name: Run tests
        run: cargo test --locked

      - name: Package and smoke test the extracted archive
        run: bash scripts/package.sh '${{ matrix.target }}'

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voltage-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows source checks
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install the toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --all-targets -- -D warnings

      # Integration tests assert Unix file ownership and permissions.
      - name: Run unit tests
        run: cargo test --locked --lib

      - name: Package and smoke test the extracted archive
        run: bash scripts/package.sh x86_64-pc-windows-msvc

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voltage-x86_64-pc-windows-msvc
          path: dist/*.zip
          if-no-files-found: error
